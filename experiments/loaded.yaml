# Loaded regime: long trips (longest-idle assignment) and more arrivals than capacity, so
# congestion actually binds. Exploratory configuration, not a result.
name: loaded
base: {height: 25, width: 25, n_agents: 80, steps: 300, task_rate: 3.0, n_moving_obstacles: 6,
       obstacle_density: 0.15, assignment: longest_idle}
variants: [b1_astar, b3_prioritized, a2_congestion, a3_priority, eppace, eppace_res]
seeds: 6
